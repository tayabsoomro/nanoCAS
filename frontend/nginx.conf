# Serves the React build and proxies API + Socket.IO calls to the backend
# container so the browser only ever talks to one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2g;

    location /socket.io/ {
        proxy_pass http://backend:5007/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Every backend route lives at the root (no /api prefix). Forward the
    # known endpoints; everything else is the single-page app.
    location ~ ^/(version|health|check_database_status|get_uid|get_all_analyses|delete_analyses|get_analysis_info|get_default_nanopore_path|upload_reference|validate_locations|get_coverage|get_coverage_summary|index_devices|upload_fasta|upload_gff|parse_fasta_headers|get_alignments|scan_directory|run_health|run_health_defaults|get_processing_status|get_alerts|test_notification)$ {
        proxy_pass http://backend:5007;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
