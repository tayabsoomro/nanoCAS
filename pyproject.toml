[project]
name = "nanocas"
version = "0.3.0"
description = "Nanopore Classification & Alerting System - live contamination detection and run-health alerting during ONT sequencing runs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
dependencies = [
    "biopython>=1.83",
    "flask==2.3.3",
    "flask-cors==5.0.1",
    "flask-socketio==5.3.6",
    "python-socketio==5.12.1",
    "python-engineio==4.11.2",
    "simple-websocket==1.1.0",
    "gunicorn>=21",
    "grpcio>=1.60",
    "protobuf>=4.25,<5",
    "minknow-api==6.2.1",
    "numpy>=1.26,<3",
    "pysam>=0.22",
    "python-dotenv>=1.0",
    "twilio>=9.0",
    "watchdog>=4.0",
    "werkzeug==3.1.3",
]

[project.optional-dependencies]
# pip install ".[dev]" / uv sync --extra dev
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
