[project]
name = "nanocas"
version = "0.1.0"
description = "Nanopore Classification & Alerting System — live alerts during ONT sequencing runs"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.86",
    "eventlet==0.39.1",
    "flask==2.3.3",
    "flask-cors==5.0.1",
    "flask-socketio==5.3.6",
    "gunicorn>=25.1.0",
    "minknow-api==6.2.1",
    "numpy==1.26.4",
    "pysam==0.23.0",
    "python-dotenv>=1.2.2",
    "twilio>=9.10.3",
    "watchdog==6.0.0",
]

[project.optional-dependencies]
# pip install ".[dev]" / uv sync --extra dev — pulls test + lint deps without
# bloating the production install. The pytest suite lives under server/tests/.
dev = [
    "pytest>=8.0",
]
