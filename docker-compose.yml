# nanoCAS: backend (Flask + Socket.IO + minimap2/samtools) and frontend (nginx).
#
#   docker compose up --build
#   open http://localhost:3000
#
# Mount the sequencer output directory into the backend container at the
# same path MinKNOW uses so the paths you enter in the wizard resolve.
services:
  backend:
    build:
      context: ./server
    ports:
      - "${BACKEND_PORT:-5007}:5007"
    volumes:
      - nanocas-workspace:/root/.nanocas
      # Example: expose a MinKNOW data directory read-only.
      # - /var/lib/minknow/data:/var/lib/minknow/data:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - NANOCAS_THREADS=${NANOCAS_THREADS:-4}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nanocas-workspace:
